version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
      dev-tooling:
        dependency-type: development
    open-pull-requests-limit: 5

  - package-ecosystem: gomod
    directory: /apps/notebook-api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: terraform
    directory: /infra/terraform/hetzner
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: terraform
    directory: /infra/terraform/cloudflare
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: docker
    directory: /apps/notebook-api
    schedule:
      interval: weekly
      day: monday
