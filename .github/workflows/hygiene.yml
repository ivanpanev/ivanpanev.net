name: hygiene

# Repository-wide checks that run on every change:
# - no plaintext secrets (gitleaks over full history)
# - every file matched by a .sops.yaml creation rule is encrypted, as judged
#   by SOPS itself (`sops filestatus`), with the file list derived from
#   .sops.yaml via scripts/sops-files.sh so CI and the runbook cannot disagree
# - shell scripts pass shellcheck
# - no CRLF sneaks into LF-normalised files
#
# Third-party actions are pinned to commit SHAs (ADR-0012). Renovate keeps
# the SHAs current.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    name: gitleaks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The gitleaks action derives a commit range from github.event.before,
      # which does not exist on the first push of a branch (M7). Run the
      # pinned CLI over the whole history instead; that is what this job
      # promises anyway.
      - name: Install pinned gitleaks (checksum-verified)
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source scripts/versions.env
          base="https://github.com/gitleaks/gitleaks/releases/download/v${PIN_GITLEAKS}"
          curl -fsSL -o gitleaks.tgz "$base/gitleaks_${PIN_GITLEAKS}_linux_x64.tar.gz"
          curl -fsSL -o sums "$base/gitleaks_${PIN_GITLEAKS}_checksums.txt"
          grep " gitleaks_${PIN_GITLEAKS}_linux_x64.tar.gz\$" sums | sed 's# .*#  gitleaks.tgz#' | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan full history
        run: |
          set -euo pipefail
          gitleaks git . --redact --exit-code 2 --report-format sarif --report-path results.sarif
          echo "gitleaks: no leaks in $(git rev-list --count HEAD) commit(s)" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report on findings
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-${{ github.run_id }}
          path: results.sarif
          if-no-files-found: ignore

  sops-encrypted:
    name: sops files are encrypted
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned sops (checksum-verified)
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source scripts/versions.env
          base="https://github.com/getsops/sops/releases/download/v${PIN_SOPS}"
          curl -fsSL -o sops "$base/sops-v${PIN_SOPS}.linux.amd64"
          curl -fsSL -o sums "$base/sops-v${PIN_SOPS}.checksums.txt"
          grep " sops-v${PIN_SOPS}.linux.amd64\$" sums | sed 's# .*#  sops#' | sha256sum -c -
          sudo install -m 0755 sops /usr/local/bin/sops
          sops --version
      - name: List files that must be encrypted (fails the job if the helper fails)
        run: |
          set -euo pipefail
          yq --version
          bash scripts/sops-files.sh > sops-files.list
          echo "$(wc -l < sops-files.list) file(s) match .sops.yaml rules"
      - name: Every listed file is encrypted according to sops itself
        run: |
          set -euo pipefail
          status=0
          count=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            count=$((count + 1))
            if ! sops filestatus "$f" | grep -q '"encrypted": *true'; then
              echo "::error file=$f::matches a .sops.yaml creation rule but is not SOPS-encrypted"
              status=1
            fi
          done < sops-files.list
          if [ "$count" -eq 0 ]; then
            echo "::warning::no files match .sops.yaml rules yet; this check is vacuous until the first encrypted file is committed"
          fi
          echo "checked $count file(s)"
          exit $status

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install shellcheck
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck
      - name: Lint
        run: |
          set -euo pipefail
          files=$(git ls-files '*.sh')
          [ -z "$files" ] && { echo "no shell scripts"; exit 0; }
          # shellcheck disable=SC2086
          shellcheck --severity=warning $files

  line-endings:
    name: no CRLF in LF files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect CRLF outside files declared as CRLF in .gitattributes
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r f; do
            case "$f" in *.ps1|*.psm1|*.cmd|*.bat) continue ;; esac
            if git grep -Il $'\r' -- "$f" >/dev/null 2>&1; then
              echo "::error file=$f::contains CRLF line endings"
              bad=1
            fi
          done < <(git ls-files)
          exit $bad
