name: hygiene

# Repository-wide checks that run on every change:
# - no plaintext secrets (gitleaks over full history)
# - every file matched by a .sops.yaml creation rule is encrypted, as judged
#   by SOPS itself (`sops filestatus`), with the file list derived from
#   .sops.yaml via scripts/sops-files.sh so CI and the runbook cannot disagree
# - shell scripts pass shellcheck
# - no CRLF sneaks into LF-normalised files
#
# Third-party actions are pinned to commit SHAs (ADR-0012). Renovate keeps
# the SHAs current.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    name: gitleaks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: "true"

  sops-encrypted:
    name: sops files are encrypted
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned sops (checksum-verified)
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source scripts/versions.env
          base="https://github.com/getsops/sops/releases/download/v${PIN_SOPS}"
          curl -fsSL -o sops "$base/sops-v${PIN_SOPS}.linux.amd64"
          curl -fsSL -o sums "$base/sops-v${PIN_SOPS}.checksums.txt"
          grep " sops-v${PIN_SOPS}.linux.amd64\$" sums | sed 's# .*#  sops#' | sha256sum -c -
          sudo install -m 0755 sops /usr/local/bin/sops
          sops --version
      - name: Every file matching a .sops.yaml rule is encrypted
        run: |
          set -euo pipefail
          status=0
          count=0
          while IFS= read -r f; do
            count=$((count + 1))
            if ! sops filestatus "$f" | grep -q '"encrypted": *true'; then
              echo "::error file=$f::matches a .sops.yaml creation rule but is not SOPS-encrypted"
              status=1
            fi
          done < <(bash scripts/sops-files.sh)
          echo "checked $count file(s)"
          exit $status

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install shellcheck
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck
      - name: Lint
        run: |
          set -euo pipefail
          files=$(git ls-files '*.sh')
          [ -z "$files" ] && { echo "no shell scripts"; exit 0; }
          # shellcheck disable=SC2086
          shellcheck --severity=warning $files

  line-endings:
    name: no CRLF in LF files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect CRLF outside files declared as CRLF in .gitattributes
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r f; do
            case "$f" in *.ps1|*.psm1|*.cmd|*.bat) continue ;; esac
            if git grep -Il $'\r' -- "$f" >/dev/null 2>&1; then
              echo "::error file=$f::contains CRLF line endings"
              bad=1
            fi
          done < <(git ls-files)
          exit $bad
