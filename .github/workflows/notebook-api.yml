name: notebook-api

# Test, lint, scan, build a distroless image, push to GHCR, cosign keyless
# sign, attach SLSA provenance, then bump the kustomize overlay tag so Argo
# CD deploys it. The overlay commit uses [skip ci] and lives outside this
# workflow's path filter so it does not retrigger the build (ADR-0012).

on:
  push:
    branches: [main]
    paths:
      - "apps/notebook-api/**"
      - ".github/workflows/notebook-api.yml"
  pull_request:
    paths:
      - "apps/notebook-api/**"
      - ".github/workflows/notebook-api.yml"

permissions:
  contents: read

concurrency:
  group: notebook-api-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: "1.27.1"
  IMAGE: ghcr.io/${{ github.repository_owner }}/notebook-api

jobs:
  test:
    name: test lint vuln
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: notebook
          POSTGRES_PASSWORD: notebook
          POSTGRES_DB: notebook
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notebook"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/notebook-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/notebook-api/go.sum
      - name: Unit tests
        run: go test ./...
      - name: Integration tests
        env:
          DATABASE_URL: postgres://notebook:notebook@127.0.0.1:5432/notebook?sslmode=disable
        run: go test -tags=integration ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          working-directory: apps/notebook-api
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  image:
    name: build push sign
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      packages: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/notebook-api
          file: apps/notebook-api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
          provenance: false
          sbom: false
      - name: Cosign keyless sign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Bump overlay image tag (no retrigger)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source scripts/versions.env
          curl -fsSL -o kustomize.tgz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${PIN_KUSTOMIZE}/kustomize_v${PIN_KUSTOMIZE}_linux_amd64.tar.gz"
          echo "029a7f0f4e1932c52a0476cf02a0fd855c0bb85694b82c338fc648dcb53a819d  kustomize.tgz" | sha256sum -c -
          tar -xzf kustomize.tgz
          install -m 0755 kustomize "$GITHUB_WORKSPACE/kustomize"
          overlay=k8s/apps/notebook-api/overlays/hetzner
          (
            cd "$overlay"
            "$GITHUB_WORKSPACE/kustomize" edit set image \
              "ghcr.io/ivanpanev/notebook-api=${IMAGE}:${GITHUB_SHA}@${DIGEST}"
          )
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$overlay/kustomization.yaml"
          if git diff --cached --quiet; then
            echo "overlay already at ${GITHUB_SHA}"
            exit 0
          fi
          git commit -m "chore(notebook-api): deploy ${GITHUB_SHA}

          [skip ci]"
          git push

