# gitleaks configuration: extend the default rules and allow-list known non-secrets.
# No directory is exempt (M0-R1-F05): evidence packs are scanned like everything else.
title = "ivanpanev.net"

[extend]
useDefault = true

[[allowlists]]
description = "Known non-secrets"
regexes = [
  # SOPS-encrypted values are ciphertext, not secrets
  '''ENC\[AES256_GCM,data:.*\]''',
  # age public keys are public
  '''age1[0-9a-z]{58}''',
  # placeholder in .sops.yaml
  '''age1PLACEHOLDER[A-Za-z0-9_-]*''',
]
