# SOPS configuration.
#
# Every file matching a creation rule below MUST be encrypted before commit.
# Recipients are age public keys. The private key never enters this repository.
#
# Bootstrap (once per operator machine):
#   scripts/sops-init.ps1        (Windows)   or   scripts/sops-init.sh   (POSIX)
# The script generates an age keypair, prints the public key, and tells you
# where SOPS expects the private key (SOPS_AGE_KEY_FILE).
#
# Recipients:
#   operator  - Ivan's workstation key. Replace the placeholder below with the
#               real public key printed by scripts/sops-init.*; it starts with
#               "age1". CI does not decrypt anything; Argo CD decrypts in-cluster
#               with its own key (added as a second recipient in Milestone 3).
#
# Rotation: add the new recipient, run `sops updatekeys` on every encrypted
# file, remove the old recipient, run `sops updatekeys` again, commit.

keys:
  - &operator age1PLACEHOLDER_REPLACE_WITH_OUTPUT_OF_scripts_sops-init
  # - &argocd_hetzner age1...   # added in Milestone 3 (k8s/bootstrap/argocd)

creation_rules:
  # Kubernetes secrets: only the data/stringData fields are encrypted so
  # manifests stay diffable.
  - path_regex: ^k8s/.*\.(enc|secret)\.ya?ml$
    encrypted_regex: ^(data|stringData)$
    key_groups:
      - age:
          - *operator

  # Terraform variable files that carry credentials.
  - path_regex: ^infra/terraform/.*\.enc\.tfvars(\.json)?$
    key_groups:
      - age:
          - *operator

  # Environment files for local development of services.
  - path_regex: ^apps/.*\.enc\.env$
    key_groups:
      - age:
          - *operator

  # Anything else explicitly named *.enc.* is fully encrypted.
  - path_regex: \.enc\.[a-z0-9]+$
    key_groups:
      - age:
          - *operator
