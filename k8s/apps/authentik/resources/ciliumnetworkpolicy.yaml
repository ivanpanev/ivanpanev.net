# Same reasoning as k8s/apps/notebook-api/base/ciliumnetworkpolicy.yaml:
# CNPG instance pods must reach kube-apiserver, which is the reserved
# Cilium entity, not a kube-system pod or a plain CIDR.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: authentik-postgres-apiserver
  namespace: authentik
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: authentik
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
---
# Gateway Envoy -> authentik-server carries the reserved `ingress` identity
# (see k8s/infrastructure/gateway/backend-ingress-entity.yaml).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: authentik-server-from-gateway
  namespace: authentik
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: authentik
      app.kubernetes.io/component: server
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
