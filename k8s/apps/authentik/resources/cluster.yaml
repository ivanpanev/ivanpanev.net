apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik
  namespace: authentik
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18
  enablePDB: false
  storage:
    size: 10Gi
    storageClass: default
  bootstrap:
    initdb:
      database: authentik
      owner: authentik
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      # Explicit so Argo CD's SSA diff matches the webhook-defaulted live object.
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: authentik
  monitoring:
    enablePodMonitor: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  env:
    - name: AWS_REGION
      value: fsn1
    - name: AWS_REQUEST_CHECKSUM_CALCULATION
      value: when_required
    - name: AWS_RESPONSE_CHECKSUM_VALIDATION
      value: when_required
    - name: AWS_EC2_METADATA_DISABLED
      value: "true"
