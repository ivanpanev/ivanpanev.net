apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: authentik-nightly
  namespace: authentik
spec:
  schedule: "0 0 2 * * *"
  backupOwnerReference: self
  immediate: false
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: authentik
