# CNPG instance pods (initdb, primary, replicas, backup jobs) talk to the API
# server. kube-apiserver is a hostNetwork static pod on the control-plane
# node: Cilium classifies it as the reserved `kube-apiserver` entity, so
# neither a kube-system namespaceSelector nor an ipBlock in a plain
# NetworkPolicy can match it (Cilium does not apply CIDR rules to cluster
# nodes). Hubble showed `policy-verdict:none EGRESS DENIED` to 10.0.64.1:6443
# until this rule existed. Cilium merges this allow-list with the
# NetworkPolicy in networkpolicy.yaml.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: notebook-postgres-apiserver
  namespace: notebook
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: notebook
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
---
# The Gateway's Envoy forwards with the reserved `ingress` identity, so the
# `namespaceSelector: gateway` rule in networkpolicy.yaml never matches and
# Envoy answered 403 "Access denied" at L7. See
# k8s/infrastructure/gateway/backend-ingress-entity.yaml.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: notebook-api-from-gateway
  namespace: notebook
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: notebook-api
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
