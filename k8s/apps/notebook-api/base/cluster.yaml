apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: notebook
  namespace: notebook
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18
  enablePDB: false
  storage:
    size: 10Gi
    storageClass: default
  bootstrap:
    initdb:
      database: notebook
      owner: notebook
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      # Set explicitly: the CNPG mutating webhook defaults it, and Argo CD's
      # server-side-apply diff otherwise reports the Cluster OutOfSync forever.
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: notebook
  monitoring:
    enablePodMonitor: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  env:
    - name: AWS_REGION
      value: fsn1
    - name: AWS_REQUEST_CHECKSUM_CALCULATION
      value: when_required
    - name: AWS_RESPONSE_CHECKSUM_VALIDATION
      value: when_required
    - name: AWS_EC2_METADATA_DISABLED
      value: "true"
