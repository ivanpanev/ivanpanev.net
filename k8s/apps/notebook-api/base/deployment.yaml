apiVersion: apps/v1
kind: Deployment
metadata:
  name: notebook-api
  namespace: notebook
  labels:
    app.kubernetes.io/name: notebook-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: notebook-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notebook-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: notebook-api
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: notebook-api
          image: ghcr.io/ivanpanev/notebook-api:main
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LISTEN_ADDR
              value: ":8080"
            - name: CORS_ORIGINS
              value: "https://ivanpanev.net"
            - name: LOG_LEVEL
              value: info
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: notebook-app
                  key: uri
            - name: TMPDIR
              value: /tmp
            - name: GOMEMLIMIT
              value: "230MiB"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: notebook-api
  namespace: notebook
  labels:
    app.kubernetes.io/name: notebook-api
spec:
  selector:
    app.kubernetes.io/name: notebook-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: notebook-api
  namespace: notebook
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notebook-api
