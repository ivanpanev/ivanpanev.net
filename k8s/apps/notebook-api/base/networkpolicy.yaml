apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: notebook-api
  namespace: notebook
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: notebook-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Gateway traffic arrives with Cilium's reserved `ingress` identity and is
    # allowed by ciliumnetworkpolicy.yaml, not by a gateway namespaceSelector
    # (that rule never matched; M7-R1-F09). Only Prometheus scrapes remain
    # here so a non-Cilium cluster still gets metrics.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: notebook
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: notebook-postgres
  namespace: notebook
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: notebook
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: notebook-api
        - podSelector:
            matchLabels:
              cnpg.io/cluster: notebook
      ports:
        - protocol: TCP
          port: 5432
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 5432
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9187
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # API-server egress lives in ciliumnetworkpolicy.yaml (Cilium entity).
    # Object storage (barman-cloud WAL archive + base backups) over HTTPS.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/16
      ports:
        - protocol: TCP
          port: 443
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: notebook
      ports:
        - protocol: TCP
          port: 5432
