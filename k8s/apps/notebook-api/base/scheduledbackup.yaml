apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: notebook-nightly
  namespace: notebook
spec:
  schedule: "0 0 2 * * *"
  backupOwnerReference: self
  immediate: false
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: notebook
