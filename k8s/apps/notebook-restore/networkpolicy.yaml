apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: notebook-restore
  namespace: notebook-restore
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # API server: hostNetwork static pod on the control-plane subnet, reached
    # post-DNAT on 6443 (see k8s/apps/notebook-api/base/networkpolicy.yaml).
    - to:
        - ipBlock:
            cidr: 10.0.64.0/20
      ports:
        - protocol: TCP
          port: 6443
    - ports:
        - protocol: TCP
          port: 443
