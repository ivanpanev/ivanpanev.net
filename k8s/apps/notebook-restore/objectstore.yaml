# Recovery reads the live prefix. Archive is disabled on the Cluster with
# cnpg.io/skipWalArchiving: enabled (no spec.plugins WAL archiver).
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: notebook
  namespace: notebook-restore
spec:
  configuration:
    destinationPath: s3://ivp-cnpg/notebook
    endpointURL: https://fsn1.your-objectstorage.com
    s3Credentials:
      accessKeyId:
        name: cnpg-s3
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-s3
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
      maxParallel: 2
    data:
      compression: gzip
      jobs: 2
  instanceSidecarConfiguration:
    env:
      - name: AWS_REGION
        value: fsn1
      - name: AWS_EC2_METADATA_DISABLED
        value: "true"
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
