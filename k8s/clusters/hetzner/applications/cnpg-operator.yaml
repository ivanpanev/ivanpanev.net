apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://cloudnative-pg.github.io/charts
      chart: cloudnative-pg
      targetRevision: 0.29.0
      helm:
        valueFiles:
          - $values/k8s/infrastructure/cnpg-operator/values.yaml
    - repoURL: https://github.com/ivanpanev/ivanpanev.net
      targetRevision: main
      ref: values
    - repoURL: https://github.com/ivanpanev/ivanpanev.net
      targetRevision: main
      path: k8s/infrastructure/cnpg-operator/resources
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
