apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hetzner-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ivanpanev/ivanpanev.net
    targetRevision: main
    path: k8s/clusters/hetzner
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
