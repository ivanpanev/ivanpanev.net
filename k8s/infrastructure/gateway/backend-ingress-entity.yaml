# Cilium's Gateway API data path is the per-node Envoy, which forwards to
# backends with the reserved `ingress` identity, not as a pod in the
# `gateway` namespace. A NetworkPolicy `namespaceSelector: gateway` therefore
# never matches, Envoy enforces the backend's policy at L7 and answers
# 403 "Access denied" (Hubble: `http-request DROPPED`). These rules add the
# `ingress` entity on the exact backend port for every HTTPRoute backend
# that lives in an infrastructure namespace; notebook-api and authentik carry
# the same rule next to their own NetworkPolicy.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana-from-gateway
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/instance: kube-prometheus-stack
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: argocd-server-from-gateway
  namespace: argocd
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-server
      app.kubernetes.io/instance: argocd
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hubble-ui-from-gateway
  namespace: kube-system
spec:
  endpointSelector:
    matchLabels:
      k8s-app: hubble-ui
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
