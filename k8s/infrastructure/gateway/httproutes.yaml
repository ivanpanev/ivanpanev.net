# parentRefs.group/kind, backendRefs.group/kind/weight and the catch-all
# `matches` are API-server defaults. They are spelled out so Argo CD's
# server-side-apply diff sees Git == live instead of a permanent OutOfSync.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: gateway
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
  hostnames:
    - grafana.ivanpanev.net
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: kube-prometheus-stack-grafana
          namespace: monitoring
          port: 80
          weight: 1
---
