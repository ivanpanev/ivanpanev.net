apiVersion: v1
kind: ConfigMap
metadata:
  name: notebook-api-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: notebook-api
data:
  notebook-api.json: |
    {
      "uid": "notebook-api",
      "title": "notebook-api",
      "schemaVersion": 39,
      "timezone": "browser",
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Request rate",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{job=\"notebook-api\"}[5m]))",
              "legendFormat": "rps"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "5xx rate",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{job=\"notebook-api\",code=~\"5..\"}[5m]))",
              "legendFormat": "5xx"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "p99 latency",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 8 },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{job=\"notebook-api\"}[5m])))",
              "legendFormat": "p99"
            }
          ]
        }
      ]
    }
