apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
    # M3-R1-F06 accepted: node-exporter and Alloy filesystem-log-reader need
    # hostPath. Splitting them into a second host-tools namespace still leaves
    # that namespace privileged and doubles ServiceMonitor/RBAC surface on a
    # two-worker cluster. Workloads keep restricted securityContext; do not
    # add new privileged pods here.
