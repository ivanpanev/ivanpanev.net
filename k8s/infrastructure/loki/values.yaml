# Chart: grafana-community/loki 18.11.7 (OSS). grafana/loki >=7 is GEL-only.
# deploymentMode Monolithic is the rename of SingleBinary (ADR-0007).

deploymentMode: Monolithic

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: s3
    bucketNames:
      chunks: ivp-loki
      ruler: ivp-loki
      admin: ivp-loki
    s3:
      endpoint: fsn1.your-objectstorage.com
      region: fsn1
      s3ForcePathStyle: true
      insecure: false
      accessKeyId: ${AWS_ACCESS_KEY_ID}
      secretAccessKey: ${AWS_SECRET_ACCESS_KEY}
    # Thanos/minio client; AWS SDK v2 checksums on grafana/loki 3.7.x ignore
    # AWS_REQUEST_CHECKSUM_CALCULATION and Hetzner Ceph returns 403.
    use_thanos_objstore: true
    object_store:
      type: s3
      s3:
        endpoint: fsn1.your-objectstorage.com
        region: fsn1
        insecure: false
        access_key_id: ${AWS_ACCESS_KEY_ID}
        secret_access_key: ${AWS_SECRET_ACCESS_KEY}
        bucket_lookup_type: path
  limits_config:
    retention_period: 720h
    allow_structured_metadata: true
    volume_enabled: true
    ingestion_rate_mb: 8
    ingestion_burst_size_mb: 16
    max_query_parallelism: 16
  compactor:
    working_directory: /var/loki/compactor
    delete_request_store: s3
    retention_enabled: true
    retention_delete_delay: 2h
  extraArgs:
    - -config.expand-env=true
  analytics:
    reporting_enabled: false

singleBinary:
  replicas: 1
  sidecar: false
  extraArgs:
    - -config.expand-env=true
  extraEnvFrom:
    - secretRef:
        name: loki-s3
  extraEnv:
    # Lowercase: AWS SDK Go env parser. Loki 3.7.7 still sets ChecksumAlgorithm
    # on PutObject; thanos client above is the actual Ceph workaround.
    - name: AWS_REQUEST_CHECKSUM_CALCULATION
      value: when_required
    - name: AWS_RESPONSE_CHECKSUM_VALIDATION
      value: when_required
    - name: AWS_EC2_METADATA_DISABLED
      value: "true"
  persistence:
    enabled: true
    storageClass: default
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1536Mi

read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

gateway:
  enabled: false

minio:
  enabled: false

chunksCache:
  enabled: false
resultsCache:
  enabled: false

lokiCanary:
  enabled: false

test:
  enabled: false

monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
  lokiCanary:
    enabled: false
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
